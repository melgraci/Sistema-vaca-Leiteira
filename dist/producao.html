<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- AdminLTE -->
  <link rel="stylesheet" href="./css/adminlte.css">
  <link rel="stylesheet" href="./css/custom.css">

  <title>Produção</title>

</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

<main class="app-main">

<!-- CONTEÚDO -->
<div class="app-content">

<div class="form-container">

  <!-- BOTÃO VOLTAR -->
  <div class="text-start mb-3">

    <a href="index.html"
      class="btn btn-outline-success btn-voltar shadow-sm">

      <i class="bi bi-arrow-left"></i>

    </a>

  </div>

  <!-- CARD -->
  <div class="custom-card">

    <!-- HEADER -->
    <div class="card-header">

      <h3 class="card-title">
        Cadastro da Produção de Leite
      </h3>

    </div>

    <!-- BODY -->
    <div class="card-body">

      <!-- ALERTAS -->
      <div id="msgProducao"></div>

      <!-- FORM -->
      <form onsubmit="salvarProducao(event)">

        <!-- DATA -->
        <div class="mb-3">

          <label class="form-label">
            Data
          </label>

          <input
            id="data"
            type="date"
            class="form-control">

        </div>

        <!-- LITROS -->
        <div class="mb-3">

          <label class="form-label">
            Quantidade (litros)
          </label>

          <input
            id="litros"
            type="number"
            class="form-control">

        </div>

        <!-- ANIMAL -->
        <div class="mb-3">

          <label class="form-label">
            Nome do animal
          </label>

          <input
            id="animal"
            type="text"
            class="form-control">

        </div>

        <!-- BOTÕES -->
        <button type="submit"
          class="btn btn-primary">

          <i class="bi bi-save"></i>
          Salvar

        </button>

        <button type="reset"
          class="btn btn-secondary">

          Cancelar

        </button>

      </form>

      <!-- TABELA -->
      <div class="mt-4">

        <table class="table table-striped table-bordered">

          <thead class="table-success">

            <tr>

              <th>Data</th>
              <th>Quantidade</th>
              <th>Animal</th>
              <th>Ações</th>

            </tr>

          </thead>

          <tbody id="listaProducao">

            <!-- EMPTY STATE -->
            <tr id="linhaVazia">

              <td colspan="4"
                class="text-center text-muted">

                Nenhuma produção cadastrada

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>
  </div>

</div>
</div>

</main>
</div>

<!-- SCRIPT -->
<script>

function salvarProducao(event) {

  event.preventDefault();

  const data = document.getElementById("data").value;
  const litros = document.getElementById("litros").value;
  const animal = document.getElementById("animal").value;

  const msg = document.getElementById("msgProducao");
  const lista = document.getElementById("listaProducao");
  const linhaVazia = document.getElementById("linhaVazia");

  // LIMPA ALERTAS
  msg.innerHTML = "";

  // VALIDAÇÃO
  if (!data || !litros || !animal) {

    msg.innerHTML = `
      <div class='alert alert-danger mt-3'>

        <i class="bi bi-exclamation-triangle-fill"></i>
        Preencha todos os campos

      </div>
    `;

    setTimeout(() => {
      msg.innerHTML = "";
    }, 3000);

    return;
  }

  // REMOVE EMPTY
  if (linhaVazia) {
    linhaVazia.remove();
  }

  // SUCESSO
  msg.innerHTML = `
    <div class='alert alert-success mt-3'>

      <i class="bi bi-check-circle-fill"></i>
      Produção cadastrada com sucesso!

    </div>
  `;

  setTimeout(() => {
    msg.innerHTML = "";
  }, 3000);

  // NOVA LINHA
  const novaLinha = `
    <tr>

      <td>${data}</td>

      <td>${litros} L</td>

      <td>${animal}</td>

      <td>

        <button
          class="btn btn-sm btn-danger"
          onclick="excluirProducao(this)">

          <i class="bi bi-trash"></i>

        </button>

      </td>

    </tr>
  `;

  lista.innerHTML += novaLinha;

  // LIMPA FORM
  document.querySelector("form").reset();
}

// EXCLUIR
function excluirProducao(botao) {

  botao.closest("tr").remove();

  const lista = document.getElementById("listaProducao");

  // SE FICAR VAZIO
  if (lista.children.length === 0) {

    lista.innerHTML = `
      <tr id="linhaVazia">

        <td colspan="4"
          class="text-center text-muted">

          Nenhuma produção cadastrada

        </td>

      </tr>
    `;
  }
}

</script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>

<!-- AdminLTE -->
<script src="./js/adminlte.js"></script>

</body>
</html>
