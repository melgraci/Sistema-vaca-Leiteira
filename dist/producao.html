<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- AdminLTE -->
  <link rel="stylesheet" href="./css/adminlte.css">

  <title>Produção</title>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

  <!-- NAVBAR -->
  <div class="app-content-header"></div>
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" data-lte-toggle="sidebar" href="#">
            <i class="bi bi-list"></i>
          </a>
        </li>
      </ul>
    </div>
  </nav>

    <div class="app-content-header">
      <div class="container-fluid">
        
      </div>
    </div>

    <!-- CONTENT -->
    <div class="app-content">
      <div class="container-fluid">

        <div class="card card-success">
          <div class="card-header">
            <h3 class="card-title">Cadastro da Produção de leite</h3>
          </div>

          <div class="card-body">
            <div id="msgProducao"></div>
            <form onsubmit="salvarProducao(event)">

              <div class="mb-3">
                <label class="form-label">Data</label>
                <input type="date" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Quantidade (litros)</label>
                <input type="number" class="form-control">
              </div>

              <div class="mb-3">
                <label class="form-label">Nome do animal</label>
                <input type="text" class="form-control">
              </div>

              <button type="submit" class="btn btn-success">Salvar</button>
              <button type="reset" class="btn btn-secondary">Cancelar</button>

            </form>
          </div>

        </div>

      </div>
    </div>
    <script>
function salvarProducao(event) {
  event.preventDefault(); // 🔥 impede recarregar a página

  const data = document.querySelector("input[type='date']").value;
  const litros = document.querySelector("input[type='number']").value;
  const animal = document.querySelector("input[type='text']").value;

  const msg = document.getElementById("msgProducao");

  if (!data || !litros || !animal) {
    msg.innerHTML = "<div class='alert alert-danger'>Preencha todos os campos</div>";
    return;
  }

  msg.innerHTML = "<div class='alert alert-success'>Produção salva com sucesso!</div>";
}
</script>

  </main>

  
  

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>
<script src="./js/adminlte.js"></script>

</body>
</html>
