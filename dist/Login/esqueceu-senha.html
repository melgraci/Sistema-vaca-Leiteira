<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Recuperar senha - Sistema Vaca Leiteira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Bootstrap + AdminLTE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/adminlte.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>
<body class="hold-transition login-page bg-white">

  <div class="login-box">
    <div class="card card-outline bg-white" style="border-top: 3px solid #28a745;">
      <div class="card-header text-center bg-white">
        <h1 class="text-dark"><b>Sistema</b> Vaca Leiteira</h1>
      </div>
      <div class="card-body">
        <p class="login-box-msg">Digite seu e-mail para redefinir a senha</p>

        <!-- Alertas de feedback -->
        <div id="alert-success" class="alert alert-success d-none" role="alert">
          Link de recuperação enviado com sucesso!
        </div>
        <div id="alert-error" class="alert alert-danger d-none" role="alert">
          E-mail não encontrado. Tente novamente.
        </div>

        <!-- Formulário -->
        <form onsubmit="return validarFormulario()">
          <div class="input-group mb-3">
            <input type="email" id="email" class="form-control" placeholder="E-mail" required>
            <div class="input-group-text"><i class="bi bi-envelope"></i></div>
          </div>
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-success w-100">Enviar link de recuperação</button>
            </div>
          </div>
        </form>

        <p class="mt-3 mb-0 text-center">
          <a href="login.html" class="text-primary">Voltar ao login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/adminlte.js"></script>

  <script>
    function validarFormulario() {
      const email = document.getElementById('email').value;

      // Exemplo: só aceita "teste@exemplo.com" como válido
      if (email === "teste@exemplo.com") {
        document.getElementById('alert-success').classList.remove('d-none');
        document.getElementById('alert-error').classList.add('d-none');
      } else {
        document.getElementById('alert-error').classList.remove('d-none');
        document.getElementById('alert-success').classList.add('d-none');
      }

      return false; // impede envio real, só pra testar, ok 
    }
  </script>
</body>
</html>
