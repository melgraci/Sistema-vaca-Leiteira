<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Sistema de monitoramento de leite | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- AdminLTE -->
  <link rel="stylesheet" href="../css/adminlte.css" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />

  <!-- Bootstrap -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

  <style>
    .card {
      border-radius: 15px;
    }

    .btn-success {
      transition: 0.3s;
    }

    .btn-success:hover {
      transform: scale(1.03);
    }

    .login-logo h1 {
      font-size: 2.2rem;
    }
  </style>
</head>

<body class="login-page bg-body-secondary">

  <div class="login-box">

    <!-- Logo -->
    <div class="login-logo">
      <h1 class="text-dark">
        <b>Sistema</b> Vaca Leiteira
      </h1>
    </div>

    <!-- Card -->
    <div class="card card-outline bg-white"
      style="border-top: 4px solid #28a745;">

      <div class="card-body login-card-body">

        <p class="login-box-msg">
          Faça login para iniciar sua sessão
        </p>

        <!-- ALERTAS -->
        <div id="alert-success"
          class="alert alert-success d-none mt-2">
          <i class="bi bi-check-circle-fill"></i>
          Login realizado com sucesso!
        </div>

        <div id="alert-error"
          class="alert alert-danger d-none mt-2">
          <i class="bi bi-x-circle-fill"></i>
          Usuário ou senha inválidos!
        </div>

        <!-- FORM -->
        <form id="formLogin">

          <!-- EMAIL -->
          <div class="input-group mb-3">

            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="E-mail"
              required>

            <div class="input-group-text">
              <i class="bi bi-envelope"></i>
            </div>

          </div>

          <!-- SENHA -->
          <div class="input-group mb-3">

            <input
              type="password"
              id="senha"
              class="form-control"
              placeholder="Senha"
              required>

            <div class="input-group-text">
              <i class="bi bi-lock-fill"></i>
            </div>

          </div>

          <!-- CHECKBOX + BOTÃO -->
          <div class="row">

            <div class="col-8">

              <div class="form-check">

                <input
                  class="form-check-input"
                  type="checkbox"
                  id="lembrar">

                <label
                  class="form-check-label"
                  for="lembrar">

                  Lembrar-me

                </label>

              </div>

            </div>

            <div class="col-4">

              <button
                type="submit"
                class="btn btn-success w-100"
                id="btnLogin">

                Entrar

              </button>

            </div>

          </div>

        </form>

        <!-- LINKS -->
        <p class="mb-1 mt-3">
          <a href="esqueceu-senha.html">
            Esqueci a minha senha
          </a>
        </p>

        <p class="mb-0">
          <a href="cadastro.html" class="text-center">
            Criar conta
          </a>
        </p>

      </div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- AdminLTE -->
  <script src="../js/adminlte.js"></script>

  <!-- SCRIPT LOGIN -->
  <script>

    const form = document.getElementById("formLogin");
    const btn = document.getElementById("btnLogin");

    form.addEventListener("submit", function (e) {

      e.preventDefault();

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      // Remove alertas anteriores
      document.getElementById("alert-success")
        .classList.add("d-none");

      document.getElementById("alert-error")
        .classList.add("d-none");

      // Estado Loading
      btn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Entrando...
      `;

      btn.disabled = true;

      // Simula carregamento
      setTimeout(() => {

        // LOGIN CORRETO
        if (
          email === "teste@exemplo.com" &&
          senha === "1234"
        ) {

          // Volta botão
          btn.innerHTML = "Entrar";

          // Mostra sucesso
          document.getElementById("alert-success")
            .classList.remove("d-none");

          // Espera MAIS 3 segundos
          setTimeout(() => {

            window.location.href =
              "/SistemaLeite/dist/index.html";

          }, 3000);

        }

        // LOGIN INCORRETO
        else {

          // Mostra erro
          document.getElementById("alert-error")
            .classList.remove("d-none");

          // Volta botão
          btn.innerHTML = "Entrar";

          btn.disabled = false;
        }

      }, 2000);

    });

  </script>

</body>

</html>
