<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Sistema de monitoramento de leite | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />


  <link rel="stylesheet" href="../css/adminlte.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="login-page bg-body-secondary">

  <div class="login-box">
    <div class="login-logo">
      <h1 class="text-dark"><b>Sistema</b> Vaca Leiteira</h1>
    </div>

    <div class="card card-outline bg-white" style="border-top: 3px solid #28a745;">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Faça login para iniciar sua sessão</p>

        
        <div id="alert-success" class="alert alert-success d-none">Login realizado com sucesso!</div>
        <div id="alert-error" class="alert alert-danger d-none">Usuário ou senha inválidos!</div>

        
        <form onsubmit="return validarLogin()">
          <div class="input-group mb-3">
            <input type="email" id="email" class="form-control" placeholder="E-mail" required>
            <div class="input-group-text"><i class="bi bi-envelope"></i></div>
          </div>
          <div class="input-group mb-3">
            <input type="password" id="senha" class="form-control" placeholder="Senha" required>
            <div class="input-group-text"><i class="bi bi-lock-fill"></i></div>
          </div>
          <div class="row">
            <div class="col-8">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="lembrar">
                <label class="form-check-label" for="lembrar">Lembrar-me</label>
              </div>
            </div>
            <div class="col-4">
              <button type="submit" class="btn btn-success w-100">Entrar</button>
            </div>
          </div>
        </form>
          

        
        <p class="mb-1"><a href="esqueceu-senha.html">Esqueci a minha senha</a></p>
        <p class="mb-0"><a href="cadastro.html" class="text-center">Criar conta</a></p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/adminlte.js"></script>

  <script>
    function validarLogin() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      if (email === "teste@exemplo.com" && senha === "1234") {
        document.getElementById('alert-success').classList.remove('d-none');
        document.getElementById('alert-error').classList.add('d-none');
      
        window.location.href = "/AdminLTE/dist/index.html";
      } else {
        document.getElementById('alert-error').classList.remove('d-none');
        document.getElementById('alert-success').classList.add('d-none');
      }
      return false; // impede envio real
    }
  </script>
</body>
</html>
