<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Sistema de monitoramento de leite | Cadastro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CSS -->
  <link rel="stylesheet" href="../css/adminlte.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="login-page bg-body-secondary">

  <div class="login-box">
    <div class="login-logo">
      <h1 class="text-dark"><b>Sistema</b> Vaca Leiteira</h1>
    </div>

    <div class="card card-outline bg-white" style="border-top: 3px solid #28a745;">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Crie sua conta para acessar o sistema</p>

        <!-- Alertas -->
        <div id="alert-success" class="alert alert-success d-none">Cadastro realizado com sucesso!</div>
        <div id="alert-error" class="alert alert-danger d-none">As senhas não conferem!</div>

        <!-- Formulário -->
        <form onsubmit="return validarCadastro()">
          <div class="input-group mb-3">
            <input type="text" id="nome" class="form-control" placeholder="Nome completo" required>
            <div class="input-group-text"><i class="bi bi-person"></i></div>
          </div>
          <div class="input-group mb-3">
            <input type="email" id="email" class="form-control" placeholder="E-mail" required>
            <div class="input-group-text"><i class="bi bi-envelope"></i></div>
          </div>
          <div class="input-group mb-3">
            <input type="password" id="senha" class="form-control" placeholder="Senha" required>
            <div class="input-group-text"><i class="bi bi-lock-fill"></i></div>
          </div>
          <div class="input-group mb-3">
            <input type="password" id="confirmar" class="form-control" placeholder="Confirmar senha" required>
            <div class="input-group-text"><i class="bi bi-lock-fill"></i></div>
          </div>
          <div class="row">
            <div class="col-12">
              <button type="submit" class="btn btn-success w-100">Cadastrar</button>
            </div>
          </div>
        </form>

        <p class="mt-3 mb-0 text-center">
          <a href="login.html" class="text-primary">Já tenho conta</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/adminlte.js"></script>

  <script>
    function validarCadastro() {
      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;

      if (senha === confirmar) {
        document.getElementById('alert-success').classList.remove('d-none');
        document.getElementById('alert-error').classList.add('d-none');
        // Redireciona para login após cadastro
        window.location.href = "login.html";
      } else {
        document.getElementById('alert-error').classList.remove('d-none');
        document.getElementById('alert-success').classList.add('d-none');
      }
      return false; // impede envio real
    }
  </script>
</body>
</html>
