<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- AdminLTE -->
  <link rel="stylesheet" href="./css/adminlte.css">

  <title>Gastos</title>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

<main class="app-main">

<!-- TÍTULO -->
<div class="app-content-header p-3">
  <h3>Gastos</h3>
</div>

<!-- CONTEÚDO -->
<div class="app-content">
<div class="container-fluid">

<div class="card card-danger">
  <div class="card-header">
    <h3 class="card-title">Cadastro de Gastos</h3>
  </div>

  <div class="card-body">

    <!-- MENSAGEM -->
    <div id="msgGasto"></div>

    <!-- FORM -->
    <form onsubmit="salvarGasto(event)">

      <div class="row">

        <div class="col-md-3 mb-3">
          <label class="form-label">Data</label>
          <input id="data" type="date" class="form-control">
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Valor (R$)</label>
          <input id="valor" type="number" class="form-control">
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Categoria</label>
          <input id="categoria" type="text" class="form-control">
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Descrição</label>
          <input id="descricao" type="text" class="form-control">
        </div>

      </div>

      <button class="btn btn-danger">Salvar</button>
      <button type="reset" class="btn btn-secondary">Cancelar</button>

    </form>

  </div>
</div>

</div>
</div>

</main>
</div>

<!-- JS -->
<script>
function salvarGasto(event) {
  event.preventDefault();

  const data = document.getElementById("data").value;
  const valor = document.getElementById("valor").value;
  const categoria = document.getElementById("categoria").value;
  const descricao = document.getElementById("descricao").value;

  const msg = document.getElementById("msgGasto");

  if (!data || !valor || !categoria || !descricao) {
    msg.innerHTML = "<div class='alert alert-danger'>Preencha todos os campos</div>";
    return;
  }

  msg.innerHTML = "<div class='alert alert-success'>Gasto cadastrado com sucesso!</div>";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>
<script src="./js/adminlte.js"></script>

</body>
</html>
