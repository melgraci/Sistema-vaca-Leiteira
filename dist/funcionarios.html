<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- AdminLTE -->
  <link rel="stylesheet" href="./css/adminlte.css">

  <title>Funcionários</title>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

<main class="app-main">

<!-- TÍTULO -->
<div class="app-content-header p-3">
  <h3>Funcionários</h3>
</div>

<!-- CONTEÚDO -->
<div class="app-content">
<div class="container-fluid">

<div class="card card-primary">
  <div class="card-header">
    <h3 class="card-title">Cadastro de Funcionários</h3>
  </div>

  <div class="card-body">

    <!-- MENSAGEM -->
    <div id="msgFuncionario"></div>

    <!-- FORM -->
    <form onsubmit="salvarFuncionario(event)">

      <div class="row">
        
        <div class="col-md-4 mb-3">
          <label class="form-label">Nome</label>
          <input id="nome" class="form-control">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Cargo</label>
          <input id="cargo" class="form-control">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Contato</label>
          <input id="telefone" class="form-control">
        </div>

      </div>

      <button class="btn btn-primary">Salvar</button>

    </form>

  </div>
</div>

</div>
</div>

</main>
</div>

<!-- JS -->
<script>
function salvarFuncionario(event) {
  event.preventDefault();

  const nome = document.getElementById("nome").value;
  const cargo = document.getElementById("cargo").value;
  const telefone = document.getElementById("telefone").value;

  const msg = document.getElementById("msgFuncionario");

  if (!nome || !cargo || !telefone) {
    msg.innerHTML = "<div class='alert alert-danger'>Preencha todos os campos</div>";
    return;
  }

  msg.innerHTML = "<div class='alert alert-success'>Funcionário cadastrado com sucesso!</div>";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>
<script src="./js/adminlte.js"></script>

</body>
</html>
